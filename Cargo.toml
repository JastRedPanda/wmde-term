[package]
name = "wmde-term"
version = "1.7.1"
authors = ["Jeremy Soller <jeremy@system76.com>"]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.93"

[dependencies]
alacritty_terminal = "0.25.1"
hex_color = { version = "3", features = ["serde"] }
indexmap = "2"
log = "0.4"
open = "5.3.2"
paste = "1.0"
regex = "1"
ron = "0.11"
serde = { version = "1", features = ["serde_derive"] }
shlex = "1"
tokio = { version = "1", features = ["sync"] }
# CLI arguments
clap_lex = "0.7"
# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
icu = { version = "2.1.1", features = ["compiled_data"] }
rust-embed = "8"
url = "2.5"
secret-service = { version = "5.1.0", features = [
    "rt-tokio-crypto-rust",
], optional = true }
thiserror = { version = "2.0", optional = true }
secstr = { version = "0.5", optional = true }

# WMDE: the file dialog comes from our forked file manager (wmde-files) instead of
# pop-os/cosmic-files. Imported under the `cosmic-files` name so `cosmic_files::dialog::*`
# in the sources resolves unchanged to wmde-files's lib.
[dependencies.cosmic-files]
package = "wmde-files"
path = "../wmde-files"
default-features = false

[dependencies.cosmic-text]
version = "0.19"
features = ["monospace_fallback", "shape-run-cache"]

[dependencies.libcosmic]
# WMDE libcosmic fork (v2), resolved by path to the sibling checkout (same as wmde-files).
path = "../libcosmic"
default-features = false
#TODO: a11y feature crashes file chooser dialog
features = [
    "about",
    "autosize",
    "multi-window",
    "tokio",
    "winit",
    "surface-message",
]

[target.'cfg(unix)'.dependencies]
fork = "0.4"

[features]
default = ["dbus-config", "wgpu", "wayland", "password_manager"]
dbus-config = ["libcosmic/dbus-config"]
wgpu = ["libcosmic/wgpu", "cosmic-files/wgpu"]
wayland = ["libcosmic/wayland", "cosmic-files/wayland"]
password_manager = ["secret-service", "thiserror", "secstr"]

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true

# WMDE: redirect every pop-os/libcosmic pull (this crate's direct dep AND the transitive
# ones from wmde-files / cosmic-settings-config, whose own [patch] is ignored when they are
# dependencies) to the local v2 fork so a single libcosmic/cosmic-config/cosmic-theme resolves
# in the graph. Mirrors wmde-files's [patch] set.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_core = { path = "../libcosmic/iced/core" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_widget = { path = "../libcosmic/iced/widget" }

# cosmic-settings-config pins libcosmic crates from the .git and trailing-slash URL variants.
